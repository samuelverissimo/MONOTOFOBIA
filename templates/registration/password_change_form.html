{% extends "base.html" %}

{% block title %}Alterar senha | MONOTOFOBIA{% endblock %}

{% block content %}
<main class="page login-page">
    <section class="login-card" aria-labelledby="password-change-title">
        <h1 id="password-change-title">Alterar senha</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="button" type="submit">Salvar nova senha</button>
        </form>
        <p class="muted"><a href="{% url 'home' %}">Voltar à home</a></p>
    </section>
</main>
{% endblock %}
