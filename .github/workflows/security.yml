name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: sqlite:///db.sqlite3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt bandit==1.9.4 pip-audit==2.10.1
      - name: Create ephemeral Django key
        run: echo "SECRET_KEY=$(python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())')" >> "$GITHUB_ENV"
      - name: Django system check
        run: python manage.py check
      - name: Check migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Django tests
        run: python manage.py test
      - name: Production configuration check
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: example.invalid
          CSRF_TRUSTED_ORIGINS: https://example.invalid
        run: python manage.py check --deploy
      - name: Dependency audit
        run: pip-audit
      - name: Static security scan
        run: bandit -r . -x ./.venv,./tests